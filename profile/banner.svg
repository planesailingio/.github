<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Plane Sailing</title>
  <desc id="d">Complex infra. Plain simple. Open-source tools for platform engineers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3247"/>
      <stop offset="1" stop-color="#154560"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7dbf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b7dbf" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect x="700" width="500" height="320" fill="url(#glow)"/>

    <!-- decorative swell lines, bottom right -->
    <g fill="none" stroke="#2b7dbf" stroke-width="2" stroke-linecap="round" opacity="0.28">
      <path d="M760 250 C 840 230, 900 270, 980 250 S 1120 230, 1220 250"/>
      <path d="M720 278 C 800 258, 860 298, 940 278 S 1080 258, 1220 278"/>
      <path d="M680 306 C 760 286, 820 326, 900 306 S 1040 286, 1220 306"/>
    </g>
  </g>

  <!-- mark: hexagon, twin sails, hull stripes (after the organisation avatar) -->
  <g transform="translate(160 160)">
    <polygon points="0,-112 97,-56 97,56 0,112 -97,56 -97,-56" fill="none" stroke="#2b7dbf" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-8 -84 L -8 24 L -62 24 Z" fill="#e6f0f8"/>
    <path d="M8 -88 L 8 24 L 74 24 Z" fill="#2b7dbf"/>
    <rect x="-3" y="-90" width="6" height="116" fill="#e6f0f8"/>
    <g stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-66 44 L -12 56" stroke="#e6f0f8"/>
      <path d="M12 56 L 66 44" stroke="#2b7dbf"/>
      <path d="M-54 66 L -12 76" stroke="#e6f0f8"/>
      <path d="M12 76 L 54 66" stroke="#2b7dbf"/>
      <path d="M-40 88 L -12 95" stroke="#e6f0f8"/>
      <path d="M12 95 L 40 88" stroke="#2b7dbf"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="330" y="146" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Plane Sailing</text>
    <text x="332" y="196" font-size="28" font-weight="500" fill="#8ec6ef">Complex infra. Plain simple.</text>
    <line x1="334" y1="218" x2="414" y2="218" stroke="#2b7dbf" stroke-width="3" stroke-linecap="round"/>
    <text x="332" y="252" font-size="18" fill="#b9cbd9">Open-source command-line tools from a DevSecOps and platform engineering team in London.</text>
    <text x="1160" y="298" font-size="14" fill="#8ec6ef" text-anchor="end" letter-spacing="0.5">planesailing.io</text>
  </g>
</svg>
